services:
  api:
    build:
      context: ./banking-api
    env_file:
      - ./banking-api/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - 3000:3000
    networks:
      - frontend
      - backend
    command: sh -c "pnpm migration:run:prod && pnpm start"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./banking-ui
    ports:
      - 80:80
    networks:
      - frontend
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./banking-api/.env
    volumes:
      - ./banking-api/data/postgres:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
  backend:
